<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guia do Comprador — Compre seu imóvel no litoral com segurança | Praia Digital</title>
<meta name="description" content="Guia completo em 10 passos para comprar imóvel no litoral paulista: documentação, financiamento, negociação e armadilhas a evitar.">
<link rel="canonical" href="https://praia.digital/guia-comprador/">
<style>:root{--azul:#0a2540;--mar:#0e7490;--areia:#f8f5ef}*{margin:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:var(--areia);color:#1e293b}header{background:linear-gradient(135deg,var(--azul),var(--mar));color:#fff;padding:2.5rem 1.5rem;text-align:center}.badge{display:inline-block;background:rgba(255,255,255,.15);padding:.25rem .8rem;border-radius:999px;font-size:.8rem;margin-bottom:.8rem}main{max-width:760px;margin:2rem auto;padding:0 1.25rem}.passo{background:#fff;border-radius:1rem;padding:1.5rem;box-shadow:0 4px 20px rgba(10,37,64,.07);margin-bottom:1rem;border-left:5px solid var(--mar)}.passo h3{display:flex;gap:.6rem;align-items:center}.passo h3 .n{background:var(--azul);color:#fff;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}.passo p{margin-top:.5rem;color:#475569;font-size:.95rem}.passo a{color:var(--mar);font-weight:600}.alerta{background:#fef2f2;border-left-color:#dc2626}.alerta h3 .n{background:#dc2626}progress{width:100%;height:10px;margin-bottom:1.5rem}.rede{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.75rem}.rede a{background:#fff;border:1px solid #e2e8f0;border-radius:.6rem;padding:.8rem;text-decoration:none;color:var(--azul);font-weight:600;font-size:.9rem}footer{text-align:center;padding:2rem;color:#64748b;font-size:.85rem}footer a{color:var(--mar)}</style>
</head>
<body>
<header><span class="badge">🛰️ App satélite de <a href="https://praia.digital" style="color:#fff">praia.digital</a></span><h1>📖 Guia do Comprador</h1><p>10 passos para comprar no litoral sem cair em armadilhas</p></header>
<main>
<label style="font-weight:600">Seu progresso: <span id="pv">0%</span> — marque os passos concluídos</label>
<progress id="prog" value="0" max="100"></progress>
<div id="passos"></div>
<h2 style="margin:1.5rem 0 .8rem">🌐 Rede Praia Digital</h2>
<div class="rede">
<a href="https://praia.digital">🏠 Portal Praia Digital</a>
<a href="https://praia.digital/checklists">✅ Checklists</a>
<a href="https://praia.digital/plano-litoral">📋 Plano Litoral</a>
<a href="https://praia.digital/simulador-credito">🏦 Simulador de Crédito</a>
<a href="https://praia.digital/apps">🛰️ Todos os apps</a>
</div>
</main>
<footer>Feito com 🌊 pela rede <a href="https://praia.digital">Praia Digital</a> · <a href="https://github.com/praiadigital/guia-comprador">código aberto no GitHub</a></footer>
<script>
const P=[
['Defina orçamento e objetivo','Morar, temporada ou investimento? Use o <a href="https://praia.digital/plano-litoral">Plano Litoral</a> para montar sua reserva.'],
['Escolha a cidade certa','Cada cidade tem perfil único. Descubra a sua no <a href="https://praia.digital/match-praia">Match Praia</a>.'],
['Simule o financiamento','Compare SBPE, MCMV e FGTS no <a href="https://praia.digital/simulador-credito">Simulador de Crédito</a> antes de visitar imóveis.'],
['Avalie o preço real','Não confie no anúncio: cheque o valor no <a href="https://praia.digital/avaliador-imoveis">Avaliador de Imóveis</a>.'],
['Visite em dia de semana e de chuva','Imóvel de praia revela infiltração, maresia e vizinhança real nos piores dias.'],
['Exija a documentação completa','Matrícula atualizada, certidões negativas do vendedor, IPTU e condomínio quitados.'],
['Verifique débitos ocultos','Dívidas de condomínio e IPTU passam para o comprador. Peça as certidões no cartório.'],
['Calcule os custos extras','ITBI, escritura e registro somam 4–8%. Use a <a href="https://praia.digital/calculadora-custos">Calculadora de Custos</a>.'],
['Negocie com dados','Apresente o preço/m² do <a href="https://praia.digital/radar-precos">Radar de Preços</a> como argumento de negociação.'],
['⚠️ Armadilha: imóvel em inventário','Imóvel preso em inventário ou com usufruto pode travar a escritura por anos. Só avance com advogado.',1]];
passos.innerHTML=P.map(([t,d,a],i)=>`<div class="passo ${a?'alerta':''}"><h3><input type="checkbox" onchange="upd()" style="width:18px;height:18px"> <span class="n">${i+1}</span> ${t}</h3><p>${d}</p></div>`).join('');
function upd(){const c=document.querySelectorAll('input[type=checkbox]:checked').length;prog.value=c*10;pv.textContent=c*10+'%';}
</script>
</body></html>
